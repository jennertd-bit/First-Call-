<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FirstCall — Owner App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #081625; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  #root { height: 100%; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes fcScreenIn { from { transform: translateY(12px); } to { transform: none; } }
  @keyframes fcFadeUp   { from { transform: translateY(8px); } to { transform: none; } }
  @keyframes fcPulse    { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes fcBlink    { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes fcRipple   { 0% { transform: scale(0.7); opacity: 0.7; } 100% { transform: scale(1.4); opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>
