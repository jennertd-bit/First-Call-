<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FirstCall — Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#0E2A47; --accent:#E8703A; --teal:#1FA8A0; --ink:#1B2733;
    --line:rgba(255,255,255,0.12);
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); -webkit-font-smoothing: antialiased; color: #fff;
    background: radial-gradient(120% 110% at 50% -10%, #14304d 0%, #0b1f33 55%, #081625 100%);
    min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 24px;
  }
  .glow { position: fixed; top: 4%; left: 50%; transform: translateX(-50%); width: 620px; height: 620px;
    border-radius: 50%; background: rgba(232,112,58,0.12); filter: blur(90px); pointer-events: none; }
  .wrap { width: 100%; max-width: 1060px; position: relative; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .mark { width: 46px; height: 46px; border-radius: 13px; background: var(--accent); display: grid; place-items: center;
    font-family: var(--mono); font-weight: 600; font-size: 23px; box-shadow: 0 0 0 7px rgba(232,112,58,0.14); }
  .brand .nm { font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: 0.04em; }
  .brand .tag { font-family: var(--mono); font-size: 11px; color: #8ba0b5; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 2px; }
  h1 { font-size: clamp(30px, 5vw, 52px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.04; }
  h1 .o { color: var(--accent); }
  .lead { font-size: clamp(15px, 1.6vw, 18px); color: #b3c2d1; max-width: 60ch; line-height: 1.55; margin-top: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 38px; }
  .card { display: flex; flex-direction: column; text-decoration: none; color: inherit; position: relative;
    background: rgba(255,255,255,0.045); border: 1px solid var(--line); border-radius: 20px; padding: 22px;
    transition: transform .2s, background .2s, border-color .2s; overflow: hidden; min-height: 280px; }
  .card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.075); border-color: rgba(232,112,58,0.5); }
  .card .badge { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    font-family: var(--mono); font-weight: 600; font-size: 16px; color: #fff; }
  .card .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8ba0b5; margin: 18px 0 5px; }
  .card h3 { font-size: 21px; font-weight: 700; letter-spacing: -0.015em; }
  .card p { font-size: 13.5px; color: #aab9c8; line-height: 1.5; margin-top: 9px; flex: 1; }
  .card .open { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; color: var(--accent); margin-top: 16px; }
  .card .viz { position: absolute; right: -10px; bottom: -10px; opacity: 0.5; }
  .chips { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 30px; }
  .chip { font-family: var(--mono); font-size: 12px; color: #9fb2c4; border: 1px solid var(--line); border-radius: 99px; padding: 7px 13px; }
  .chip b { color: var(--teal); }
  .foot { margin-top: 26px; font-family: var(--mono); font-size: 10.5px; color: #6f8095; letter-spacing: 0.04em; line-height: 1.5; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .card { min-height: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0E2A47"/>
    <circle cx="50" cy="50" r="24" fill="#E8703A"/>
    <text x="50" y="60" font-family="monospace" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">F</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="web/platform.jsx"></script>
</body>
</html>
