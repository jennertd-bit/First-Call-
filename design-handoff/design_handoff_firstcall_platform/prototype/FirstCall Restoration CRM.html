<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FirstCall — Restoration CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #F4F3EF; -webkit-font-smoothing: antialiased; }
  #root { height: 100%; }
  button, input, textarea, select { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(14,42,71,0.16); border-radius: 8px; border: 2px solid #F4F3EF; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(14,42,71,0.28); }
  @keyframes wFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wPop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes wSlideIn { from { transform: translateX(6px); } to { transform: none; } }
  @keyframes wSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0E2A47"/>

    <rect x="42" y="30" width="16" height="40" rx="3" fill="#E8703A"/>
    <rect x="62" y="30" width="16" height="40" rx="3" fill="#9fb2c4"/>

</template>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
